name: Release

# Push a tag like v1.2.0 (or v1.3.0-rc.1 for a pre-release) to publish.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mr-anjaneyam/jobtrace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 1.2.0 always; 1.2, 1 and latest only for stable releases (the action skips them for pre-releases)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: latest=auto

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jobtrace:smoke
          build-args: |
            JOBTRACE_VERSION=${{ steps.ver.outputs.version }}
            JOBTRACE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run -d --name smoke -p 8000:8000 jobtrace:smoke
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/version >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/version | tee /dev/stderr | jq -e --arg v "$VERSION" '.version == $v'
          curl -fsS http://127.0.0.1:8000/ | grep -qi "<div id=\"root\">"
          docker rm -f smoke

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JOBTRACE_VERSION=${{ steps.ver.outputs.version }}
            JOBTRACE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare release files
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir release
          sed "s|JOBTRACE_VERSION:-latest|JOBTRACE_VERSION:-${VERSION}|" deploy/docker-compose.yml > release/docker-compose.yml
          grep -q "JOBTRACE_VERSION:-${VERSION}" release/docker-compose.yml
          # GitHub renames uploaded dotfiles, so .env.example ships as env.example
          cp .env.example release/env.example
          cp config.example.yaml release/
          cat > release/notes-header.md <<EOF
          ## Run it

          \`\`\`bash
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/v${VERSION}/docker-compose.yml
          docker compose up -d
          \`\`\`

          Then open http://localhost:8000. Image: \`${IMAGE}:${VERSION}\` (linux/amd64 and linux/arm64).

          ---

          EOF

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v${VERSION}" \
            --title "JobTrace ${VERSION}" \
            --generate-notes \
            --notes-file release/notes-header.md \
            "${flags[@]}" \
            release/docker-compose.yml release/env.example release/config.example.yaml
